name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  release:
    if: github.ref_type == 'tag'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release source and version
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$package_version" ] || [ "$package_version" != "$manifest_version" ]; then
            echo "::error::Tag, package version, and manifest version must match exactly"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Create GitHub release with Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(main.js manifest.json styles.css)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
