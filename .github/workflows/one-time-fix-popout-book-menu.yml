name: One-time popout book-menu fix

on:
    push:
        branches: [fix/popout-book-menu-dedup]
        paths:
            - '.github/workflows/one-time-fix-popout-book-menu.yml'

permissions:
    contents: write

jobs:
    fix-and-verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'npm'

            - name: Make book-menu refresh idempotent per tab host
              shell: bash
              run: |
                  python3 - <<'PY'
                  from pathlib import Path

                  path = Path('src/decorations.ts')
                  text = path.read_text(encoding='utf-8')
                  old = '''\t\tconst seen = new Set<object>();
                  \t\tthis.plugin.app.workspace.iterateAllLeaves((leaf) => {
                  \t\t\tconst group = getInternalTabGroupDom(leaf);
                  \t\t\tconst identity = group?.identity ?? leaf.parent;
                  \t\t\tif (seen.has(identity)) return;
                  \t\t\tseen.add(identity);
                  \t\t\tconst book = this.plugin.navigation.getBookForGroup(leaf);
                  \t\t\tif (!book) return;
                  \t\t\tconst host = getTabHeaderHost(leaf, group);
                  \t\t\tif (!host) return;
                  \t\t\tconst button = host.createEl('button', {
                  '''
                  new = '''\t\tconst seenHosts = new Set<HTMLElement>();
                  \t\tthis.plugin.app.workspace.iterateAllLeaves((leaf) => {
                  \t\t\tconst group = getInternalTabGroupDom(leaf);
                  \t\t\tconst host = getTabHeaderHost(leaf, group);
                  \t\t\tif (!host || seenHosts.has(host)) return;
                  \t\t\tseenHosts.add(host);
                  \t\t\t// Pop-out transitions can expose several transient group identities for one live tab host.
                  \t\t\t// The DOM host is the invariant: keep exactly one pseudo-tab control attached to it.
                  \t\t\thost.querySelectorAll(':scope > .scope-tabs-book-menu-tab').forEach((el) => el.remove());
                  \t\t\tconst book = this.plugin.navigation.getBookForGroup(leaf);
                  \t\t\tif (!book) return;
                  \t\t\tconst button = host.createEl('button', {
                  '''
                  if text.count(old) != 1:
                      raise SystemExit(f'Expected exactly one refreshBookMenus target, found {text.count(old)}')
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  PY

            - name: Bump immutable release version
              run: npm version patch --no-git-tag-version

            - name: Verify
              run: |
                  npm ci
                  npm run build
                  npm run lint

            - name: Commit verified fix directly to main
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git rm .github/workflows/one-time-fix-popout-book-menu.yml
                  git add -- src/decorations.ts manifest.json package.json package-lock.json versions.json
                  git commit -m "Fix duplicated book controls in pop-outs"
                  git push origin HEAD:main
